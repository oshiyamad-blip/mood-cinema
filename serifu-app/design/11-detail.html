<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>台本詳細 — セリフ稽古</title>
<style>
  :root{
    --indigo-700:#1E40AF;--indigo-600:#1D4ED8;--indigo-500:#2563EB;--indigo-400:#60A5FA;
    --indigo-100:#DBEAFE;--indigo-050:#EFF6FF;
    --amber-500:#F5A623;--ink-900:#172033;--ink-700:#334155;--ink-500:#64748B;--ink-300:#94A3B8;
    --line:#E2E8F0;--surface:#FFFFFF;--bg:#F4F7FB;
    --r-sm:10px;--r-md:16px;--r-lg:24px;--r-pill:999px;
    --shadow-sm:0 2px 8px rgba(15,33,70,.08);--shadow-md:0 8px 24px rgba(15,33,70,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;background:#2A3550;display:flex;justify-content:center;padding:24px;color:var(--ink-900);}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:40px;box-shadow:0 16px 40px rgba(0,0,0,.4);overflow:hidden;position:relative;}
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:700;}
  .nav{display:flex;align-items:center;gap:12px;padding:6px 20px 12px;}
  .nav .back{font-size:22px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;}
  .nav .nt{font-size:18px;font-weight:800;}
  .scroll{padding:4px 20px 110px;height:calc(844px - 44px - 56px);overflow:auto;}

  .hero{background:linear-gradient(135deg,var(--indigo-500),var(--indigo-700));border-radius:var(--r-lg);padding:20px;color:#fff;box-shadow:0 10px 24px rgba(75,63,176,.4);margin-bottom:18px;}
  .hero h2{font-size:22px;font-weight:800;}
  .hero .stats{display:flex;gap:18px;margin-top:12px;}
  .hero .stat .n{font-size:20px;font-weight:800;}
  .hero .stat .l{font-size:11px;opacity:.85;}

  .block{background:#fff;border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px;}
  .block .bt{font-size:14px;font-weight:800;color:var(--ink-700);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .block .bt .req{font-size:10px;font-weight:700;color:var(--amber-500);background:#FFF7E9;padding:2px 7px;border-radius:6px;margin-left:auto;}

  .chips{display:flex;gap:10px;flex-wrap:wrap;}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-700);border-radius:var(--r-pill);padding:9px 16px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;}
  .chip .dot{width:10px;height:10px;border-radius:50%;}
  .chip.selected{background:var(--indigo-500);color:#fff;border-color:var(--indigo-500);box-shadow:0 4px 12px rgba(37,99,235,.3);}
  .chip .dot.t{background:#2563EB;} .chip .dot.h{background:#E5709B;} .chip .dot.s{background:#36B3A8;}
  .chip.selected .dot{background:#fff;}
  .hint{font-size:12px;color:var(--ink-500);margin-top:10px;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;}
  .toggle-row .lbl{font-size:15px;font-weight:700;}
  .toggle-row .desc{font-size:12px;color:var(--ink-500);margin-top:3px;}
  .toggle{width:50px;height:30px;border-radius:var(--r-pill);background:var(--indigo-500);position:relative;flex:none;}
  .toggle .knob{position:absolute;top:3px;left:23px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);}

  .link-row{display:flex;align-items:center;gap:12px;padding:4px 0;cursor:pointer;}
  .link-row .ico{width:42px;height:42px;border-radius:12px;background:var(--indigo-050);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
  .link-row .lt{font-size:15px;font-weight:700;}
  .link-row .ld{font-size:12px;color:var(--ink-500);margin-top:2px;}
  .link-row .arr{margin-left:auto;color:var(--ink-300);font-size:20px;}

  .footer{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 26px;background:linear-gradient(180deg,rgba(246,245,251,0),var(--bg) 35%);}
  .start{width:100%;background:var(--indigo-500);color:#fff;border:none;font-family:inherit;font-weight:800;font-size:17px;padding:16px;border-radius:var(--r-pill);box-shadow:0 10px 24px rgba(37,99,235,.45);display:flex;align-items:center;justify-content:center;gap:10px;}
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>セリフ稽古</span><span>●●● ▮</span></div>
    <div class="nav"><div class="back">‹</div><div class="nt">台本詳細</div></div>
    <div class="scroll">
      <div class="hero">
        <h2>桜の季節・第一幕</h2>
        <div class="stats">
          <div class="stat"><div class="n">3</div><div class="l">登場人物</div></div>
          <div class="stat"><div class="n">48</div><div class="l">行</div></div>
          <div class="stat"><div class="n">6/28</div><div class="l">最終練習</div></div>
        </div>
      </div>

      <div class="block">
        <div class="bt">あなたの役を選ぶ<span class="req">必須</span></div>
        <div class="chips">
          <span class="chip selected"><span class="dot"></span>太郎</span>
          <span class="chip"><span class="dot h"></span>花子</span>
          <span class="chip"><span class="dot s"></span>店員</span>
        </div>
        <div class="hint">選んだ役はあなたが演じます。残りの役をアプリが読み上げます。</div>
      </div>

      <div class="block">
        <div class="bt">ト書きの読み上げ</div>
        <div class="toggle-row">
          <div><div class="lbl">ON</div><div class="desc">（朝、駅のホーム）などを音声化</div></div>
          <div class="toggle"><div class="knob"></div></div>
        </div>
      </div>

      <div class="block">
        <div class="bt">相手役の声設定</div>
        <div class="link-row">
          <div class="ico">🔊</div>
          <div>
            <div class="lt">声を調整する</div>
            <div class="ld">花子・店員 / 性別・テンポ・試聴</div>
          </div>
          <div class="arr">›</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <button class="start">▶ 練習を開始</button>
    </div>
  </div>
</body>
</html>
