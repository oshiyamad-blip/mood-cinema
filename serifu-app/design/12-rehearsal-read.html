<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>リハーサル・台本表示 — セリフ稽古</title>
<style>
  :root{
    --indigo-500:#2563EB;--indigo-400:#60A5FA;--indigo-100:#DBEAFE;
    --amber-600:#D98A12;--amber-500:#F5A623;--amber-200:#FCE3B4;--amber-050:#FFF7E9;
    --ink-900:#172033;--ink-700:#334155;--ink-500:#64748B;--ink-300:#94A3B8;
    --line:#E2E8F0;--bg:#F4F7FB;
    --r-sm:10px;--r-md:16px;--r-pill:999px;
    --shadow-sm:0 2px 8px rgba(15,33,70,.08);--shadow-md:0 8px 24px rgba(15,33,70,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;background:#2A3550;display:flex;justify-content:center;padding:24px;color:var(--ink-900);}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:40px;box-shadow:0 16px 40px rgba(0,0,0,.4);overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:700;flex:none;}

  .topbar{display:flex;align-items:center;gap:10px;padding:4px 18px 10px;flex:none;}
  .topbar .back{font-size:22px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;}
  .topbar .ti{font-size:15px;font-weight:800;}
  .topbar .prog{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-500);}
  .pbar{height:5px;background:var(--line);margin:0 18px;border-radius:3px;flex:none;}
  .pbar .pf{height:5px;width:42%;background:var(--indigo-500);border-radius:3px;}

  /* mode switch */
  .modesw{display:flex;background:var(--indigo-100);border-radius:var(--r-pill);padding:4px;margin:12px 18px;flex:none;}
  .modesw button{flex:1;border:none;background:transparent;font-family:inherit;font-weight:700;font-size:13px;padding:9px;border-radius:var(--r-pill);color:var(--indigo-500);}
  .modesw button.active{background:#fff;color:var(--ink-900);box-shadow:var(--shadow-sm);}

  /* teleprompter */
  .prompter{flex:1;overflow:hidden;padding:8px 22px;position:relative;}
  .ln{padding:10px 0;font-size:18px;line-height:1.55;}
  .ln .sp{font-size:12px;font-weight:800;padding:2px 9px;border-radius:var(--r-pill);margin-right:8px;}
  .sp.taro{background:var(--indigo-100);color:#1E40AF;} .sp.hanako{background:#FCE4EE;color:#C2456F;}
  .ln.past{opacity:.34;}
  .ln.dir{color:var(--ink-500);font-style:italic;font-size:15px;opacity:.5;}

  .current{background:#fff;border-radius:var(--r-md);padding:18px 16px;box-shadow:var(--shadow-md);border-left:5px solid var(--indigo-500);margin:6px 0;}
  .current .sp{background:#FCE4EE;color:#C2456F;}
  .current .txt{font-size:24px;font-weight:700;line-height:1.5;margin-top:8px;}
  .current .now{font-size:11px;font-weight:800;color:var(--indigo-500);display:inline-flex;align-items:center;gap:6px;}
  .now .bp{width:8px;height:8px;border-radius:50%;background:var(--indigo-500);}

  /* your turn banner */
  .yourturn{background:linear-gradient(135deg,var(--amber-500),var(--amber-600));border-radius:var(--r-md);padding:16px;box-shadow:0 10px 24px rgba(245,166,35,.45);margin:6px 0;color:#3a2a00;}
  .yourturn .yt{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .yourturn .yt .star{font-size:16px;}
  .yourturn .txt{font-size:24px;font-weight:800;line-height:1.5;margin-top:8px;}
  .yourturn .timer{font-size:12px;font-weight:700;margin-top:8px;opacity:.8;}

  /* controls */
  .controls{flex:none;padding:14px 20px 22px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(15,33,70,.06);}
  .crow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .cbtn{width:48px;height:48px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-700);border:none;}
  .play{width:64px;height:64px;border-radius:50%;background:var(--indigo-500);color:#fff;font-size:26px;border:none;box-shadow:0 8px 20px rgba(37,99,235,.5);}
  .mic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:none;background:var(--amber-050);color:var(--amber-600);position:relative;}
  .mic.on{background:var(--amber-500);color:#3a2a00;box-shadow:0 0 0 6px rgba(245,166,35,.25);}
  .speed{font-size:13px;font-weight:800;color:var(--indigo-500);background:var(--indigo-100);padding:6px 12px;border-radius:var(--r-pill);}
  .clabels{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-300);margin-top:8px;padding:0 4px;}
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>リハーサル</span><span>●●● ▮</span></div>
    <div class="topbar">
      <div class="back">‹</div>
      <div class="ti">桜の季節・第一幕</div>
      <div class="prog">20 / 48</div>
    </div>
    <div class="pbar"><div class="pf"></div></div>

    <div class="modesw">
      <button class="active">台本表示</button>
      <button>暗記</button>
    </div>

    <div class="prompter">
      <div class="ln dir">（朝、駅のホーム）</div>
      <div class="ln past"><span class="sp taro">太郎</span>おはよう、花子。</div>

      <div class="current">
        <span class="now"><span class="bp"></span>再生中・相手役</span>
        <div><span class="sp">花子</span></div>
        <div class="txt">おはよう。今日は早いね。</div>
      </div>

      <div class="yourturn">
        <div class="yt"><span class="star">★</span>あなたの番 — 太郎</div>
        <div class="txt">うん、オーディションがあるんだ。</div>
        <div class="timer">タップ／▶で次へ　（自動進行 3秒）</div>
      </div>

      <div class="ln" style="opacity:.5"><span class="sp hanako">花子</span>大丈夫、練習した通りに…</div>
    </div>

    <div class="controls">
      <div class="crow">
        <button class="cbtn">⏮</button>
        <button class="cbtn">◀</button>
        <button class="play">⏸</button>
        <button class="cbtn">▶</button>
        <button class="mic on">🎙</button>
      </div>
      <div class="clabels">
        <span>頭出し</span><span>前へ</span><span>再生/停止</span><span>次へ</span><span style="color:var(--amber-600);font-weight:700">マイクON</span>
      </div>
      <div style="text-align:center;margin-top:10px;"><span class="speed">速度 1.2×</span></div>
    </div>
  </div>
</body>
</html>
