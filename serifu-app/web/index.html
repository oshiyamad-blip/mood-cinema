<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="日本語の俳優セリフ練習・オーディション練習アプリ（Web確認用）">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ホンヨミ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ホンヨミ</title>
  <link rel="manifest" href="manifest.json">

  <!--
    一部のアプリ内ブラウザ（LINE/SNSのリンク等）や特殊なブラウザ/OS設定では
    navigator.language が空、または "en-US@posix" のような非BCP-47文字列になる。
    その状態で Flutter を起動するとロケール解決が
    「Incorrect locale information provided」で失敗し、画面が真っ白になる。
    Flutter を読み込む前に、各言語タグから @修飾子(@posix等)や .エンコーディングを
    取り除いて正規化し、正しい形が1つも無ければ 'ja' を補って回避する。
    通常のブラウザ（ja-JP / en-US 等）はそのまま素通しするので影響しない。
  -->
  <script>
    (function () {
      try {
        var clean = function (v) {
          if (!v) return '';
          v = String(v).split('@')[0].split('.')[0].trim(); // @posix / .UTF-8 を除去
          return /^[A-Za-z0-9-]+$/.test(v) ? v : '';         // BCP-47らしい形のみ採用
        };
        var src = (navigator.languages && navigator.languages.length)
          ? navigator.languages : [navigator.language];
        var cleaned = [];
        for (var i = 0; i < src.length; i++) {
          var c = clean(src[i]);
          if (c && cleaned.indexOf(c) === -1) cleaned.push(c);
        }
        if (cleaned.length === 0) cleaned = ['ja'];
        Object.defineProperty(navigator, 'languages', { get: function () { return cleaned; }, configurable: true });
        Object.defineProperty(navigator, 'language', { get: function () { return cleaned[0]; }, configurable: true });
      } catch (e) { /* 失敗しても通常のブラウザには影響しない */ }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
